[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "shelfscan"
version = "0.1.0"
description = "Evidence-checked book-cover annotation and catalogue extraction"
requires-python = ">=3.11"
dependencies = ["pillow>=11,<13", "pydantic>=2.10,<3", "pyyaml>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["shelfscan", "scripts", "annotation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
